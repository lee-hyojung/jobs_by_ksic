<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>산업별 종사자 지도 (1km 격자, 중분류)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sea:#E4EBEE; --ink:#1B2A31; --muted:#56666E; --panel:rgba(255,255,255,.95); --edge:rgba(27,42,49,.14);
  --btn:#FFFFFF; --btn-on:#1B2A31; --btn-on-ink:#FFFFFF; --sgg:rgba(27,42,49,.38); --sido:rgba(27,42,49,.85); --casing:rgba(255,255,255,.55); --coast:rgba(27,42,49,.35);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sea:#0E1920; --ink:#E4ECEF; --muted:#9CACB3; --panel:rgba(16,27,33,.95); --edge:rgba(228,236,239,.14);
  --btn:#16252C; --btn-on:#E4ECEF; --btn-on-ink:#0E1920; --sgg:rgba(228,236,239,.35); --sido:rgba(228,236,239,.85); --casing:rgba(14,25,32,.55); --coast:rgba(228,236,239,.3); } }
:root[data-theme="dark"]{ --sea:#0E1920; --ink:#E4ECEF; --muted:#9CACB3; --panel:rgba(16,27,33,.95); --edge:rgba(228,236,239,.14);
  --btn:#16252C; --btn-on:#E4ECEF; --btn-on-ink:#0E1920; --sgg:rgba(228,236,239,.35); --sido:rgba(228,236,239,.85); --casing:rgba(14,25,32,.55); --coast:rgba(228,236,239,.3); }
*,*::before,*::after{box-sizing:border-box}   /* 여백·테두리를 폭 안에 포함 (휴대폰에서 조작판이 화면 밖으로 삐져나오지 않게) */
html,body{height:100%;min-height:600px;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--sea);color:var(--ink);overflow:hidden;position:relative}
#grid,#over{position:absolute;inset:0;width:100%;height:100%;display:block}
#over{touch-action:none;cursor:crosshair}
.lvl{fill:none;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
#coast{stroke:var(--coast);stroke-width:.6px}#sgg{stroke:var(--sgg);stroke-width:.7px}#sidoCase{stroke:var(--casing);stroke-width:3px}#sido{stroke:var(--sido);stroke-width:1.4px}
#cell{fill:none;stroke:#E09A12;stroke-width:2px;vector-effect:non-scaling-stroke;pointer-events:none}
.panel{position:absolute;background:var(--panel);border:1px solid var(--edge);border-radius:10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#head{top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;padding:15px 17px 13px;width:min(390px,calc(100vw - 28px))}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
h1{font-size:1.15rem;line-height:1.3;font-weight:600;margin:0 0 3px;letter-spacing:-.01em}
.sub{font-size:.76rem;color:var(--muted);margin:0 0 10px;line-height:1.5}
.cur{display:none;font-size:.76rem;color:var(--muted);margin:3px 0 0;line-height:1.45}
.row{margin:0 0 9px}.lab{font-size:.7rem;color:var(--muted);margin:0 0 3px}
.yrs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.yrs button{font:inherit;font-size:.76rem;padding:5px 0;border-radius:6px;border:1px solid var(--edge);background:var(--btn);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.yrs button[aria-pressed="true"]{background:var(--btn-on);color:var(--btn-on-ink);border-color:var(--btn-on);font-weight:600}
.yrs button[disabled]{opacity:.35;cursor:not-allowed}
select{width:100%;box-sizing:border-box;font:inherit;font-size:.84rem;padding:7px 8px;border:1px solid var(--edge);border-radius:8px;background:var(--btn);color:var(--ink)}
button:focus-visible,select:focus-visible{outline:2px solid #C0622D;outline-offset:1px}
.def{font-size:.72rem;color:var(--muted);margin:5px 0 0;line-height:1.5}
.bar{display:grid;height:11px;border-radius:3px;overflow:hidden;margin-top:8px}
.ticks{display:grid;font-size:.64rem;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.ticks span{transform:translateX(-50%);white-space:nowrap}.ticks span:first-child{transform:none}
.keys{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.7rem;color:var(--muted);margin-top:6px}
.keys span{display:inline-flex;align-items:center;gap:5px}
.ln{display:inline-block;width:18px;height:0;vertical-align:middle}
.views{display:flex;gap:4px;margin-top:9px;flex-wrap:wrap}
.views button,.toggle,.rtoggle{font:inherit;font-size:.74rem;padding:4px 8px;border-radius:7px;border:1px solid var(--edge);background:var(--btn);color:var(--ink);cursor:pointer}
.toggle,.rtoggle{display:none;font-size:.76rem;padding:5px 10px;white-space:nowrap}
#read{right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding:13px 16px;width:min(310px,calc(100vw - 28px))}
#read .name{font-size:1rem;font-weight:600;margin:0}#read .where{font-size:.74rem;color:var(--muted);margin:2px 0 0}
#read .big{font-size:1.55rem;font-weight:500;margin:6px 0 0;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#read .big small{font-size:.85rem;color:var(--muted);font-weight:400;margin-left:3px}
.stats{display:grid;grid-template-columns:auto auto;gap:3px 14px;font-size:.78rem;margin:8px 0 0;font-variant-numeric:tabular-nums}
.stats dt{color:var(--muted)}.stats dd{margin:0;text-align:right}
.how{font-size:.7rem;color:var(--muted);margin:7px 0 0;line-height:1.5}
#err{display:none;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 18px;font-size:.9rem;max-width:min(460px,calc(100vw - 40px));line-height:1.5}
#err small{color:var(--muted);font-size:.78rem}
@media (max-width:680px){
  #head{padding:10px 12px 9px;max-height:calc(100% - 170px);overflow:auto;-webkit-overflow-scrolling:touch}
  h1{font-size:1rem;margin:2px 0 0}
  .toggle,.rtoggle{display:inline-block}
  .cur{display:block}
  #head:not(.open) #ctrl{display:none}
  #head.open .cur{display:none}
  #head.open #ctrl{margin-top:8px}
  #read{left:10px;right:10px;width:auto;padding:10px 12px}
  .rtoggle{position:absolute;top:8px;right:10px;padding:3px 8px;font-size:.72rem}
  #readc{padding-right:78px}
  #read.more #readc{padding-right:0}
  #read:not(.more) .how{display:none}
  #read:not(.more) .stats dt:nth-of-type(n+3),#read:not(.more) .stats dd:nth-of-type(n+3){display:none}
  #read .big{font-size:1.3rem;margin-top:4px}
}
</style>
</head>
<body>
<canvas id="grid" aria-hidden="true"></canvas>
<svg id="over" role="img" aria-label="1km 격자별 산업(중분류) 종사자 수 지도"></svg>
<section id="head" class="panel">
  <div class="top"><h1>산업별 종사자 지도</h1><button id="toggle" class="toggle" aria-expanded="false" aria-controls="ctrl">설정 ▾</button></div>
  <p class="cur" id="cur"></p>
  <div id="ctrl">
    <p class="sub">전국 1km 격자별 종사자 수를 산업(중분류)별로 보여 줘요. 격자에 마우스를 올리면 값과 동 이름이 나와요.</p>
    <div class="row"><p class="lab">연도</p><div class="yrs" id="years"></div><p class="def" id="pnote"></p></div>
    <div class="row"><p class="lab">산업 (중분류)</p><select id="ind" aria-label="산업 선택"></select></div>
    <div class="views" role="group" aria-label="보기 범위">
      <button data-v="all">전국</button><button data-v="metro">수도권</button><button data-v="busan">부산·울산</button><button data-v="daegu">대구</button><button data-v="daejeon">대전·세종</button><button data-v="gwangju">광주</button><button data-v="jeju">제주</button>
    </div>
  </div>
  <div id="legend"></div>
</section>
<section id="read" class="panel"><button id="rtoggle" class="rtoggle" aria-expanded="false" aria-controls="readc">자세히 ▴</button><div id="readc" aria-live="polite"><p class="how">불러오는 중…</p></div></section>
<section id="err" class="panel">지도를 불러오지 못했어요.</section>
<script src="lib/d3.min.js"></script>
<script>window.d3||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"><\/script>')</script>
<script src="lib/topojson-client.min.js"></script>
<script>window.topojson||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson-client/3.1.0/topojson-client.min.js"><\/script>')</script>
<script>
(async function(){
const err=m=>{ const e=document.getElementById('err'); e.style.display='block'; e.innerHTML='지도를 불러오지 못했어요.<br><small>'+m+'</small>'; };
if(!window.d3||!window.topojson){ err('지도 라이브러리를 불러오지 못했어요. 저장소에 lib 폴더가 있는지 확인하세요.'); return; }
if(location.protocol==='file:'){ err('파일을 더블클릭해 열면 자료를 읽을 수 없어요. GitHub Pages 주소로 열어 주세요.'); return; }
const getJSON=async f=>{ const r=await fetch(f).catch(()=>{ throw f+' 를 받지 못했어요.'; }); if(!r.ok) throw f+' 가 없어요(HTTP '+r.status+').'; return r.json(); };
// .gz 자료: 서버가 이미 풀어서 보냈으면 그대로, 아니면 브라우저에서 푼다
async function getGz(f){ const r=await fetch(f); if(!r.ok) throw f+' 가 없어요(HTTP '+r.status+').';
  const buf=new Uint8Array(await r.arrayBuffer()); if(!(buf[0]===0x1f&&buf[1]===0x8b)) return buf;
  if(!('DecompressionStream' in window)) throw '이 브라우저는 압축 자료를 풀지 못해요. 크롬·엣지·사파리 최신판으로 열어 주세요.';
  const s=new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip')); return new Uint8Array(await new Response(s).arrayBuffer()); }
let IDX,BND,DONGS,DONG;
try{ [IDX,BND,DONGS]=await Promise.all([getJSON('data/index.json'),getJSON('data/bnd.topo.json'),getJSON('data/dongs.json')]);
  const d=await getGz('data/dong.bin.gz'); DONG=new Uint16Array(d.buffer,d.byteOffset,d.byteLength/2); }catch(e){ err(String(e)); return; }
const W=IDX.W,H=IDX.H,E=IDX.ext,N=W*H;                       // E = [x0,y0,x1,y1] 격자 가장자리 (EPSG:5179, m)
const AVAIL=Object.keys(IDX.years).map(Number).sort((a,b)=>a-b);
const norm=s=>s.replace(/[\s;,.\-·ㆍ‧∙]/g,'');
const S={year:AVAIL[AVAIL.length-1],code:'total',data:null,msg:''}; S.period=IDX.years[S.year];
{ const hp=new URLSearchParams(location.hash.slice(1));
  if(hp.has('y')&&IDX.years[hp.get('y')]){ S.year=+hp.get('y'); S.period=IDX.years[S.year]; }
  if(hp.has('c')&&(hp.get('c')==='total'||IDX.periods[S.period].items.some(i=>i.c===hp.get('c')))) S.code=hp.get('c'); }
// ---------- 색
const PAL=["#EFCFE3","#E3AFD2","#D08BC0","#B866AD","#9544A0","#6E2A86","#431A66"];
const ramp=n=>{ if(n<=0) return [PAL[3]]; const o=[]; for(let k=0;k<=n;k++) o.push(PAL[Math.round(k*(PAL.length-1)/n)]); return o; };
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const brk=()=> S.code==='total'? IDX.breaks.total : ((IDX.breaks[S.period]||{})[S.code]||[]);
const item=()=> S.code==='total'? {c:'total',n:'전체 산업 (중분류 합계)'} : (IDX.periods[S.period].items.find(i=>i.c===S.code)||{c:S.code,n:S.code});
// ---------- 지도 틀
const over=d3.select("#over"), cv=document.getElementById("grid"), ctx=cv.getContext("2d");
const off=document.createElement("canvas"); off.width=W; off.height=H; const octx=off.getContext("2d"); const img=octx.createImageData(W,H);
const frame={type:"Feature",geometry:{type:"Polygon",coordinates:[[[E[0],E[1]],[E[2],E[1]],[E[2],E[3]],[E[0],E[3]],[E[0],E[1]]]]}};
const proj=d3.geoIdentity().reflectY(true), path=d3.geoPath(proj);
const g=over.append("g"), obj=BND.objects.sgg, sc=f=>f.properties.SGG;
const coast=g.append("path").attr("id","coast").attr("class","lvl"), sggL=g.append("path").attr("id","sgg").attr("class","lvl"),
      sidoC=g.append("path").attr("id","sidoCase").attr("class","lvl"), sidoL=g.append("path").attr("id","sido").attr("class","lvl"), cellR=g.append("rect").attr("id","cell").attr("width",0);
const MC=topojson.mesh(BND,obj,(a,b)=>a===b), MS=topojson.mesh(BND,obj,(a,b)=>a!==b&&sc(a)!==sc(b)), MD=topojson.mesh(BND,obj,(a,b)=>a!==b&&sc(a).slice(0,2)!==sc(b).slice(0,2));
let Wc=0,Hc=0,left=0,T=d3.zoomIdentity; const dpr=Math.max(1,window.devicePixelRatio||1);
function render(){ ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); ctx.setTransform(dpr,0,0,dpr,0,0);
  const [ax,ay]=proj([E[0],E[3]]), [bx,by]=proj([E[2],E[1]]); const pxPerCell=(bx-ax)*T.k/W;
  ctx.imageSmoothingEnabled=pxPerCell<1.5; ctx.imageSmoothingQuality="high";            // 아주 멀리서는 칸이 사라지지 않게 부드럽게, 가까이서는 칸 모양 그대로
  ctx.drawImage(off,T.applyX(ax),T.applyY(ay),(bx-ax)*T.k,(by-ay)*T.k); }
let raf=0; const req=()=>{ if(!raf) raf=requestAnimationFrame(()=>{ raf=0; render(); }); };
const zoom=d3.zoom().scaleExtent([1,70]).on("zoom",e=>{ T=e.transform; g.attr("transform",T); sggL.style("opacity",Math.min(1,.35+T.k/5)); req(); });
over.call(zoom).on("dblclick.zoom",null);
const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function toBox(b,dur){ const [x0,y1]=proj([b[0],b[1]]), [x1,y0]=proj([b[2],b[3]]);
  const k=Math.min(70,0.9/Math.max((x1-x0)/(Wc-left),(y1-y0)/Hc));
  over.transition().duration(reduce?0:dur).call(zoom.transform,d3.zoomIdentity.translate(left+(Wc-left)/2,Hc/2).scale(k).translate(-(x0+x1)/2,-(y0+y1)/2)); }
function size(){ const r=over.node().getBoundingClientRect(); if(r.width<50||r.height<50) return;
  if(Math.abs(r.width-Wc)<1&&Math.abs(r.height-Hc)<1) return; Wc=r.width; Hc=r.height;
  cv.width=Math.round(Wc*dpr); cv.height=Math.round(Hc*dpr); over.attr("viewBox",`0 0 ${Wc} ${Hc}`);
  left=Wc>780?420:0; const pad=Math.min(Wc,Hc)*0.04, top=Wc>780?0:document.getElementById('head').offsetHeight+18, bottom=Wc>780?0:document.getElementById('read').offsetHeight+18;
  proj.fitExtent([[left+pad,top+pad],[Wc-pad,Hc-bottom-pad]],frame);
  coast.attr("d",path(MC)); sggL.attr("d",path(MS)); sidoC.attr("d",path(MD)); sidoL.attr("d",path(MD)); cellR.attr("width",0);
  over.call(zoom.transform,d3.zoomIdentity); req(); }
new ResizeObserver(size).observe(over.node()); size();
// ---------- 자료 읽기
const cache=new Map();
const getCached=k=>{ if(!cache.has(k)){ if(cache.size>24) cache.delete(cache.keys().next().value);
  cache.set(k,getGz(`data/${k}.bin.gz`).then(u=>new Uint32Array(u.buffer,u.byteOffset,N))); } return cache.get(k); };
async function load(){ const k=`${S.year}/${S.code}`; d3.select("#readc").html(`<p class="how">${item().n} 자료를 불러오는 중…</p>`);
  try{ const b=await getCached(k); if(`${S.year}/${S.code}`!==k) return; S.data=b; paint(); }catch(e){ err(String(e)); } }
// ---------- 색칠·범례·요약
function paint(){ if(!S.data) return; const br=brk(), cols=ramp(br.length), rgb=cols.map(hex), px=img.data, D=S.data;
  for(let i=0;i<N;i++){ const v=D[i], o=i*4; if(v===0){ px[o+3]=0; continue; } let k=0; while(k<br.length&&v>=br[k]) k++; const c=rgb[k]; px[o]=c[0]; px[o+1]=c[1]; px[o+2]=c[2]; px[o+3]=255; }
  octx.putImageData(img,0,0); req(); legend(cols,br); summary(); updCur(); history.replaceState(null,"",`#y=${S.year}&c=${S.code}`); }
function legend(cols,br){ const L=d3.select("#legend").html(""), n=cols.length;
  L.append("div").attr("class","bar").style("grid-template-columns",`repeat(${n},1fr)`).selectAll("span").data(cols).join("span").style("background",c=>c);
  L.append("div").attr("class","ticks").style("grid-template-columns",`repeat(${n},1fr)`).selectAll("span").data([""].concat(br.map(b=>b.toLocaleString()))).join("span").text(t=>t);
  L.append("div").attr("class","keys").html(`<span>1km 칸당 종사자 수(명)</span><span><i class="ln" style="border-top:1.4px solid var(--sido)"></i>시도</span><span><i class="ln" style="border-top:1px solid var(--sgg)"></i>시군구</span>`); }
const updCur=()=>{ document.getElementById('cur').textContent=`${S.year}년 · ${item().n}`; };
const LET='가나다라마바사아';
const cellId=(c,r)=>{ const x=E[0]+c*1000, y=E[3]-(r+1)*1000, ex=Math.floor((x-700000)/100000), ey=Math.floor((y-1300000)/100000);
  return LET[ex]+LET[ey]+String(Math.floor(((x-700000)%100000)/1000)).padStart(2,"0")+String(Math.floor(((y-1300000)%100000)/1000)).padStart(2,"0"); };
const dname=i=> (i>=0&&i<65535)? `${DONGS.s[i]} ${DONGS.g[i]} ${DONGS.n[i]}` : '';
function summary(){ if(!S.data) return; const st=(IDX.stats[S.year]||{})[S.code], R=d3.select("#readc");
  const head=`<p class="name">${item().n}</p><p class="where">${S.year}년 · ${IDX.periods[S.period].label}</p>`;
  if(!st){ R.html(head+`<p class="how">이 연도의 통계가 없어요.</p>`); return; }
  R.html(head+`<dl class="stats"><dt>전국 합계(격자 합)</dt><dd>${st.sum.toLocaleString()}명</dd><dt>값이 있는 칸</dt><dd>${st.n.toLocaleString()}개</dd>
    <dt>가장 큰 칸</dt><dd>${st.max.toLocaleString()}명</dd><dt></dt><dd>${st.mc>=0?dname(DONG[st.mc]):''}</dd></dl>
    <p class="how">격자에 마우스를 올리면 그 칸의 값과 동 이름이 나와요. 1~2명인 칸은 값이 공개되지 않아 비어 있을 수 있어요.</p>`); }
function cellAt(mx,my){ const [ux,uy]=T.invert([mx,my]); const [x,y]=proj.invert([ux,uy]); const c=Math.floor((x-E[0])/1000), r=Math.floor((E[3]-y)/1000); return (c<0||r<0||c>=W||r>=H)? -1 : r*W+c; }
function showCell(i){ const v=S.data[i], di=DONG[i];
  if(v===0&&di===65535){ cellR.attr("width",0); summary(); return; }
  const c=i%W, r=Math.floor(i/W), [x0,y0]=proj([E[0]+c*1000,E[3]-r*1000]), [x1,y1]=proj([E[0]+(c+1)*1000,E[3]-(r+1)*1000]);
  cellR.attr("x",x0).attr("y",y0).attr("width",x1-x0).attr("height",y1-y0);
  d3.select("#readc").html(`<p class="name">${di<65535?DONGS.n[di]:'(행정동 밖)'}</p><p class="where">${di<65535?DONGS.s[di]+' '+DONGS.g[di]+' · ':''}격자 ${cellId(c,r)}</p>
   <p class="big">${v>0?v.toLocaleString()+'<small>명</small>':'—'}</p><p class="how">${item().n}, ${S.year}년${v===0?' · 값이 없는 칸이에요(종사자가 없거나 비공개)':''}</p>`); }
const move=e=>{ if(!S.data) return; const [mx,my]=d3.pointer(e), i=cellAt(mx,my); if(i<0){ cellR.attr("width",0); return; } showCell(i); };
over.on("pointermove",move).on("pointerdown",move).on("pointerleave",()=>{ cellR.attr("width",0); summary(); });
// ---------- 조작: 연도, 산업
function fillSelect(){ const p=IDX.periods[S.period], sel=d3.select("#ind").html("");
  sel.append("option").attr("value","total").text("전체 산업 (중분류 합계)");
  for(const [gname,items] of d3.group(p.items,d=>d.g||"")){ const par=gname? sel.append("optgroup").attr("label",gname) : sel;
    items.forEach(it=>{ const st=(IDX.stats[S.year]||{})[it.c]; par.append("option").attr("value",it.c).text(`${it.c} ${it.n}${st&&st.n===0?' (자료 없음)':''}`); }); }
  sel.property("value",S.code); }
function yearButtons(){ d3.select("#years").selectAll("button").data(IDX.yearsAll).join("button").attr("data-y",d=>d).text(d=>d)
  .attr("disabled",d=>IDX.years[d]?null:"").attr("aria-pressed",d=>String(d===S.year)).attr("title",d=>IDX.years[d]?IDX.periods[IDX.years[d]].label:"자료 준비 중")
  .on("click",(e,d)=>setYear(d));
  const yrs=AVAIL.filter(y=>IDX.years[y]===S.period);
  d3.select("#pnote").text(`${IDX.periods[S.period].label} 적용 연도: ${yrs.join(", ")}. ${S.msg||'분류 차수가 다른 연도 사이에는 같은 이름의 산업만 이어서 볼 수 있어요.'}`); }
function setYear(y){ if(!IDX.years[y]||y===S.year) return; const oldP=S.period, newP=IDX.years[y]; S.msg='';
  if(newP!==oldP){ const old=S.code==='total'?null:IDX.periods[oldP].items.find(i=>i.c===S.code); let code='total';
    if(old){ const m=IDX.periods[newP].items.find(i=>norm(i.n)===norm(old.n)); if(m) code=m.c; else S.msg=`'${old.n}'은(는) ${IDX.periods[newP].label}에 같은 이름이 없어 전체 산업으로 바꿨어요.`; }
    S.period=newP; S.code=code; S.year=y; } else S.year=y;
  fillSelect();
  yearButtons(); load(); }
d3.select("#ind").on("change",function(){ S.code=this.value; S.msg=''; yearButtons(); load(); });
d3.selectAll(".views button").on("click",function(){ const v=this.dataset.v; if(v==='all') over.transition().duration(reduce?0:650).call(zoom.transform,d3.zoomIdentity); else toBox(IDX.views[v],650); });
// 모바일: 조작판 접기·펼치기
const head=document.getElementById('head'), tg=document.getElementById('toggle'), mob=()=>window.matchMedia('(max-width:680px)').matches;
const setOpen=o=>{ head.classList.toggle('open',o); tg.setAttribute('aria-expanded',String(o)); tg.textContent=o?'접기 ▴':'설정 ▾'; if(o) head.scrollTop=0; };
tg.addEventListener('click',()=>setOpen(!head.classList.contains('open')));
const rd=document.getElementById('read'), rt=document.getElementById('rtoggle');
rt.addEventListener('click',()=>{ const m=!rd.classList.contains('more'); rd.classList.toggle('more',m); rt.setAttribute('aria-expanded',String(m)); rt.textContent=m?'간단히 ▾':'자세히 ▴'; });
over.on('pointerdown.close',()=>{ if(mob()&&head.classList.contains('open')) setOpen(false); });
d3.select("#ind").on("change.close",()=>{ if(mob()) setOpen(false); });
fillSelect(); yearButtons(); load();
})();
</script>
</body>
